# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.workers.max=3
org.gradle.daemon=false
# MBM: 限制 Kotlin 编译守护进程内存，避免与 Gradle 进程叠加超出 8GB cgroup 上限被 OOM
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# MBM（AGP 9.4 / Gradle 9.8.2 工具链轮）：本工程 18 个模块间无横向任务耦合（依赖只走
# api/implementation 与 DataDescriptor 的显式 dependsOn），可安全并行；并发度仍受
# org.gradle.workers.max=3 约束，不会把 8GB cgroup 顶穿（历史 OOM 教训见 pitfalls）。
org.gradle.parallel=true
# Gradle 9.4 起并行「模型构建」（IDE 同步）由 org.gradle.tooling.parallel 独立控制；
# 9.8 起依赖 org.gradle.parallel 隐式推导已弃用，Gradle 10 会直接报错，故显式声明。
org.gradle.tooling.parallel=true
# 本地构建缓存：跨分支/回退版本重编时复用任务输出。
org.gradle.caching=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.nonTransitiveRClass=true
# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true
# Build property overrides
# 构建双轨（MBM v1.0.26 / P2-9）：
#   默认轨 = arm64-v8a 单 ABI。开发/自测/灰度走这条，4 ABI 全量原生重编在
#   受限构建环境（8GB cgroup）下会 OOM，arm64 覆盖 99%+ 的真机；
#   全量轨 = 手动改为 supportedABIs 后出 RimePlugin-*.apk 全渠道包。
#   上架轨 = bundleRelease（AAB），Google Play 自行分 ABI 下发，装机体积极小。
buildABI=arm64-v8a
#buildVersionName=
#buildCommitHash=
#buildTimestamp=
# MBM（AGP 9.4 工具链轮）：提前强制 AGP 10 的严格行为做兼容验证。
# 官方建议「先用 9.x 做到无警告且不用 opt-out，再升 10.0」，这里直接把两个开关顶到
# true：newDsl=新 Variant API/DSL，builtInKotlin=内置 Kotlin（不再单独 apply kotlin-android）。
# 本工程已全部通过（含完整 assembleDebug），故 AGP 10 升级路径的 DSL 层面已清空障碍。
android.newDsl=true
android.builtInKotlin=true
# MBM：配置缓存暂不启用——native install 任务仍依赖「json 任务 doFirst 传值」的
# 跨任务隐式通信，CC 下各任务反序列化出独立副本，值传不过来（见 pitfalls #77）。
# 本轮已完成 CC 兼容的前置改造（任务内不再捕获 project、不再用不可序列化 lambda），
# 待把 cmake/cxx 路径改为配置期确定后再开启。
# org.gradle.configuration-cache=true
